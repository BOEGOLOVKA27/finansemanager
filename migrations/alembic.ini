# alembic.ini

[alembic]
# Путь к скриптам миграций
script_location = migrations

# Шаблон для имен файлов миграций
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Префикс для sys.path
prepend_sys_path = .

# Разделитель для путей версий  
version_path_separator = os

# Кодировка выходных файлов
output_encoding = utf-8

# Запускать environment во время команды revision
# revision_environment = false

# Разрешить .pyc и .pyo файлы без исходного .py
# sourceless = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# URL для подключения к БД - ВАЖНО: эта настройка будет переопределена Flask!
