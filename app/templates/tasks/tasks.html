{% extends "base.html" %}

{% block title %}Задачи — FinanceTrack{% endblock %}

{% block content %}
<section class="tasks-section">
    <div class="section-header">
        <h2 class="section-title">Управление задачами</h2>
        <button class="btn btn-primary" id="openCreateTaskBtn">
            <i class="fas fa-plus"></i>
            Новая задача
        </button>
    </div>

    <!-- Карточка создания задачи (скрыта по умолчанию) -->
    <div class="card" id="createTaskCard" style="display: none;">
        <div class="card-body">
            <div class="card-header">
                <h3 class="card-title">Создать новую задачу</h3>
                <button class="btn btn-outline btn-sm" id="closeCreateTaskBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="createTaskForm" class="task-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="taskTitle" class="form-label">Название задачи *</label>
                        <input type="text" id="taskTitle" name="title" class="form-input" required placeholder="Введите название задачи">
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDescription" class="form-label">Описание</label>
                        <textarea id="taskDescription" name="description" class="form-input form-textarea" rows="3" placeholder="Введите описание задачи (необязательно)"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskTagInput" class="form-label">Теги</label>
                        <div class="tag-input-wrapper">
                            <input type="text" id="taskTagInput" class="form-input" placeholder="Введите тег и нажмите Добавить">
                            <button type="button" class="btn btn-primary btn-sm" id="addTagBtn">
                                <i class="fas fa-plus"></i> Добавить
                            </button>
                        </div>
                        <div class="selected-tags" id="selectedTagsContainer"></div>
                        <small class="form-hint">Добавляйте теги по одному, каждый будет с хештегом</small>
                        <input type="hidden" id="taskTags" name="tags">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-plus"></i>
                        Создать задачу
                    </button>
                    <button type="reset" class="btn btn-outline">
                        <i class="fas fa-undo"></i>
                        Очистить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Фильтры и поиск -->
    <div class="tasks-filters">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">
                <i class="fas fa-list"></i>
                Все
            </button>
            <button class="filter-btn" data-filter="pending">
                <i class="fas fa-clock"></i>
                В работе
            </button>
            <button class="filter-btn" data-filter="completed">
                <i class="fas fa-check-circle"></i>
                Выполненные
            </button>
        </div>
        
        <div class="search-group">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchTasks" class="search-input" placeholder="Поиск задач...">
            </div>
        </div>
    </div>

    <!-- Список задач -->
    <div class="card">
        <div class="card-body">
            <div class="card-header">
                <h3 class="card-title">Список задач</h3>
                <div class="task-stats">
                    <span class="stat-badge stat-total">Всего: <strong id="totalTasks">0</strong></span>
                    <span class="stat-badge stat-pending">В работе: <strong id="pendingTasks">0</strong></span>
                    <span class="stat-badge stat-completed">Выполнено: <strong id="completedTasks">0</strong></span>
                </div>
            </div>
            
            <div id="tasksList" class="tasks-list">
                <!-- Задачи будут загружены здесь -->
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Загрузка задач...</span>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.tasks-section {
    padding: 2rem 0;
}

.task-form {
    max-width: 100%;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-bottom: 1.5rem;
}

.form-textarea {
    resize: vertical;
    min-height: 80px;
}

.form-hint {
    display: block;
    margin-top: 0.5rem;
    color: var(--text-lighter);
    font-size: 0.875rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    justify-content: flex-start;
}

.tag-input-wrapper {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
}

.tag-input-wrapper .form-input {
    flex: 1;
}

.selected-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    min-height: 32px;
}

.selected-tag-item {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.75rem;
    background: var(--primary);
    border-radius: 1rem;

    color: white;
}

.selected-tag-item .remove-tag {
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s;
}

.selected-tag-item .remove-tag:hover {
    opacity: 1;
}

.tasks-filters {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 1.5rem 0;
    flex-wrap: wrap;
    gap: 1rem;
}

.filter-group {
    display: flex;
    gap: 0.5rem;
}

.filter-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--background-light);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.875rem;
}

.filter-btn:hover {
    background: var(--background-lighter);
    border-color: var(--primary);
}

.filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.search-group {
    flex: 1;
    max-width: 400px;
}

.search-box {
    position: relative;
}

.search-box i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-lighter);
}

.search-input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    background: var(--background-light);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    color: var(--text);
    font-size: 0.875rem;
}

.search-input:focus {
    outline: none;
    border-color: var(--primary);
}

.tasks-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.task-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1.25rem;
    background: var(--background-light);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    transition: all 0.2s;
}

.task-item:hover {
    border-color: var(--primary);
    transform: translateX(4px);
}

.task-item.completed {
    opacity: 0.7;
}

.task-item.completed .task-title {
    text-decoration: line-through;
    color: var(--text-lighter);
}

.task-checkbox {
    margin-top: 0.25rem;
    width: 1.25rem;
    height: 1.25rem;
    cursor: pointer;
    accent-color: var(--success);
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.5rem;
}

.task-description {
    color: var(--text-light);
    font-size: 0.875rem;
    margin-bottom: 0.75rem;
    line-height: 1.5;
}

.task-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}

.task-tags {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.task-tag {
    padding: 0.25rem 0.75rem;
    background: var(--primary);
    border-radius: 1rem;
    font-size: 0.75rem;
    color: white;
}

.task-date {
    color: var(--text-lighter);
    font-size: 0.75rem;
}

.task-actions {
    display: flex;
    gap: 0.5rem;
}

.task-action-btn {
    padding: 0.5rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
}

.task-action-btn:hover {
    background: var(--background-lighter);
    border-color: var(--primary);
    color: var(--primary);
}

.task-action-btn.delete:hover {
    border-color: var(--error);
    color: var(--error);
}

.loading-state,
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    color: var(--text-lighter);
    gap: 1rem;
}

.loading-state i {
    font-size: 2rem;
    color: var(--primary);
}

.empty-state i {
    font-size: 3rem;
    color: var(--text-lighter);
}

.task-stats {
    display: flex;
    gap: 1rem;
}

.stat-badge {
    padding: 0.25rem 0.75rem;
    background: var(--background-light);
    border-radius: 1rem;
    font-size: 0.75rem;
    color: var(--text-light);
}

.stat-badge strong {
    color: var(--text);
}

.stat-total {
    border: 1px solid var(--primary);
}

.stat-pending {

    }
    
    .tasks-filters {
        flex-direction: column;
        align-items: stretch;
    }
    
    .filter-group {
        justify-content: center;
    }
    
    .search-group {
        max-width: 100%;
    }
    
    .task-item {
        flex-direction: column;

    .task-actions {
        width: 100%;

</style>

<script type="module">
import { ServerAPI } from '{{ url_for("static", filename="js/server.js") }}';

const serverAPI = new ServerAPI();

// Функция для получения и сохранения токена через сессию Flask
async function fetchAndStoreToken() {
    // Проверяем, есть ли уже токен
    if (serverAPI.getAuthToken()) {
        console.log('Токен уже существует');
        return true;
    }
    
    try {
        // Запрашиваем токен через API, используя существующую сессию Flask
        const response = await fetch('/api/auth/token', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            credentials: 'same-origin' // Отправляем куки сессии
        });
        
        if (response.ok) {
            const data = await response.json();
            if (data.status === 'success' && data.access_token) {
                // Сохраняем токен в localStorage
                localStorage.setItem('access_token', data.access_token);
                console.log('Токен успешно получен и сохранен');
                return true;
            }
        }
        console.error('Не удалось получить токен:', response.status);
        return false;
    } catch (error) {
        console.error('Ошибка при получении токена:', error);
        return false;
    }
}

// Элементы DOM
const createTaskForm = document.getElementById('createTaskForm');
const tasksList = document.getElementById('tasksList');
const searchInput = document.getElementById('searchTasks');
const filterButtons = document.querySelectorAll('.filter-btn');
const totalTasksEl = document.getElementById('totalTasks');
const pendingTasksEl = document.getElementById('pendingTasks');
const completedTasksEl = document.getElementById('completedTasks');

let allTasks = [];
let currentFilter = 'all';

// Загрузка задач
async function loadTasks() {
    // Сначала убеждаемся, что токен получен
    await fetchAndStoreToken();
    
    try {
        const data = await serverAPI.get('/api/tasks', { per_page: 100 });
        
        if (data.status === 'success') {
            allTasks = data.data;
            renderTasks();
            updateStats();
        } else {
            showEmptyState('Ошибка загрузки задач');
        }
    } catch (error) {
        console.error('Error loading tasks:', error);
        showEmptyState('Не удалось загрузить задачи');
    }
}

// Рендеринг задач
function renderTasks(filteredTasks = null) {
    const tasks = filteredTasks || allTasks;
    
    if (tasks.length === 0) {
        showEmptyState();
        return;
    }
    
    tasksList.innerHTML = tasks.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
            <input type="checkbox" class="task-checkbox" 
                   ${task.completed ? 'checked' : ''} 
                   onchange="toggleTaskStatus(${task.id}, ${!task.completed})">
            
            <div class="task-content">
                <h4 class="task-title">${escapeHtml(task.title)}</h4>
                ${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ''}
                
                <div class="task-meta">
                    <span class="task-date">
                        <i class="far fa-calendar"></i>
                        ${new Date(task.created_at).toLocaleDateString('ru-RU')}
                    </span>
                    ${task.tags && task.tags.length > 0 ? `
                        <div class="task-tags">
                            ${task.tags.map(tag => `<span class="task-tag">#${escapeHtml(tag.name)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            </div>
            
            <div class="task-actions">
                <button class="task-action-btn" onclick="editTask(${task.id})" title="Редактировать">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="task-action-btn delete" onclick="deleteTask(${task.id})" title="Удалить">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    `).join('');
}

// Обновление статистики
function updateStats() {
    const total = allTasks.length;
    const completed = allTasks.filter(t => t.completed).length;
    const pending = total - completed;
    
    totalTasksEl.textContent = total;
    pendingTasksEl.textContent = pending;
    completedTasksEl.textContent = completed;
}

// Показать пустое состояние
function showEmptyState(message = null) {
    tasksList.innerHTML = `
        <div class="empty-state">
            <i class="fas fa-tasks"></i>
            <p>${message || 'Нет задач'}</p>
            ${!message ? '<p style="font-size: 0.875rem;">Создайте первую задачу с помощью формы выше</p>' : ''}
        </div>
    `;
}

// Экранирование HTML
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Массив для хранения выбранных тегов
let selectedTags = [];

// Функция для добавления тега
function addTag() {
    const tagInput = document.getElementById('taskTagInput');
    const tagName = tagInput.value.trim();
    
    if (!tagName) {
        return;
    }
    
    // Проверяем, нет ли уже такого тега
    if (selectedTags.some(t => t.toLowerCase() === tagName.toLowerCase())) {
        showNotification('Такой тег уже добавлен', 'error');
        return;
    }
    
    selectedTags.push(tagName);
    renderSelectedTags();
    tagInput.value = '';
    tagInput.focus();
}

// Функция для удаления тега
function removeTag(tagName) {
    selectedTags = selectedTags.filter(t => t !== tagName);
    renderSelectedTags();
}

// Рендеринг выбранных тегов
function renderSelectedTags() {
    const container = document.getElementById('selectedTagsContainer');
    const hiddenInput = document.getElementById('taskTags');
    
    if (selectedTags.length === 0) {
        container.innerHTML = '';
        hiddenInput.value = '';
        return;
    }
    
    container.innerHTML = selectedTags.map(tag => `
        <span class="selected-tag-item">
            #${escapeHtml(tag)}
            <i class="fas fa-times remove-tag" onclick="removeTag('${tag.replace(/'/g, "\\'")}')"></i>
        </span>
    `).join('');
    
    hiddenInput.value = selectedTags.join(',');
}

// Обработчики для добавления тегов
document.getElementById('addTagBtn').addEventListener('click', addTag);
document.getElementById('taskTagInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        addTag();
    }
});

// Создание задачи
createTaskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';
    
    const formData = new FormData(createTaskForm);
    const tagsInput = formData.get('tags');
    
    // Получаем существующие теги или создаем новые
    let tagIds = [];
    if (tagsInput && tagsInput.trim()) {
        const tagNames = tagsInput.split(',').map(t => t.trim()).filter(t => t);
        
        // Получаем все теги пользователя
        try {
            const tagsData = await serverAPI.get('/api/tags');
            
            if (tagsData.status === 'success') {
                const existingTags = tagsData.data;
                
                // Находим ID существующих тегов и создаем новые
                for (const name of tagNames) {
                    let existingTag = existingTags.find(t => t.name.toLowerCase() === name.toLowerCase());
                    
                    if (existingTag) {
                        tagIds.push(existingTag.id);
                    } else {
                        // Создаем новый тег
                        try {
                            const newTagData = await serverAPI.post('/api/tags', { name: name });
                            if (newTagData.status === 'success') {
                                tagIds.push(newTagData.data.id);
                                existingTags.push(newTagData.data);
                            }
                        } catch (tagError) {
                            console.error('Error creating tag:', tagError);
                        }
                    }
                }
            }
        } catch (error) {
            console.error('Error fetching tags:', error);
        }
    }
    
    const taskData = {
        title: formData.get('title'),
        description: formData.get('description') || '',
        tag_ids: tagIds
    };
    
    try {
        const data = await serverAPI.post('/api/tasks', taskData);
        
        if (data.status === 'success') {
            // Добавляем новую задачу в список
            allTasks.unshift(data.data);
            renderTasks();
            updateStats();
            
            createTaskForm.reset();
            selectedTags = [];
            renderSelectedTags();
            
            // Показываем уведомление
            showNotification('Задача успешно создана!', 'success');
        } else {
            showNotification(data.message || 'Ошибка при создании задачи', 'error');
        }
    } catch (error) {
        console.error('Error creating task:', error);
        showNotification('Ошибка при создании задачи', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-plus"></i> Создать задачу';
    }
});

// Переключение статуса задачи
window.toggleTaskStatus = async (taskId, completed) => {
    try {
        const data = await serverAPI.put(`/api/tasks/${taskId}`, { completed });
        
        if (data.status === 'success') {
            // Обновляем задачу в списке
            const taskIndex = allTasks.findIndex(t => t.id === taskId);
            if (taskIndex !== -1) {
                allTasks[taskIndex].completed = completed;
                renderTasks();
                updateStats();
            }
            
            showNotification(`Задача отмечена как ${completed ? 'выполненная' : 'не выполненная'}`, 'success');
        } else {
            showNotification('Ошибка при обновлении статуса', 'error');
            loadTasks(); // Перезагружаем задачи
        }
    } catch (error) {
        console.error('Error toggling task status:', error);
        showNotification('Ошибка при обновлении статуса', 'error');
        loadTasks();
    }
};

// Удаление задачи
window.deleteTask = async (taskId) => {
    if (!confirm('Вы уверены, что хотите удалить эту задачу?')) {
        return;
    }
    
    try {
        const data = await serverAPI.delete(`/api/tasks/${taskId}`);
        
        if (data.status === 'success') {
            // Удаляем задачу из списка
            allTasks = allTasks.filter(t => t.id !== taskId);
            renderTasks();
            updateStats();
            
            showNotification('Задача удалена', 'success');
        } else {
            showNotification('Ошибка при удалении задачи', 'error');
        }
    } catch (error) {
        console.error('Error deleting task:', error);
        showNotification('Ошибка при удалении задачи', 'error');
    }
};

// Редактирование задачи
window.editTask = async (taskId) => {
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;
    
    const newTitle = prompt('Изменить название задачи:', task.title);
    if (newTitle === null) return;
    
    const newDescription = prompt('Изменить описание:', task.description || '');
    
    try {
        const data = await serverAPI.put(`/api/tasks/${taskId}`, {
            title: newTitle,
            description: newDescription
        });
        
        if (data.status === 'success') {
            // Обновляем задачу в списке
            const taskIndex = allTasks.findIndex(t => t.id === taskId);
            if (taskIndex !== -1) {
                allTasks[taskIndex] = data.data;
                renderTasks();
            }
            
            showNotification('Задача обновлена', 'success');
        } else {
            showNotification('Ошибка при обновлении задачи', 'error');
        }
    } catch (error) {
        console.error('Error updating task:', error);
        showNotification('Ошибка при обновлении задачи', 'error');
    }
};

// Фильтрация задач
filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        currentFilter = btn.dataset.filter;
        applyFilters();
    });
});

// Поиск задач
searchInput.addEventListener('input', applyFilters);

// Применение фильтров и поиска
function applyFilters() {
    let filtered = [...allTasks];
    
    // Фильтр по статусу
    if (currentFilter === 'pending') {
        filtered = filtered.filter(t => !t.completed);
    } else if (currentFilter === 'completed') {
        filtered = filtered.filter(t => t.completed);
    }
    
    // Поиск
    const searchTerm = searchInput.value.toLowerCase().trim();
    if (searchTerm) {
        filtered = filtered.filter(t => 
            t.title.toLowerCase().includes(searchTerm) ||
            (t.description && t.description.toLowerCase().includes(searchTerm)) ||
            (t.tags && t.tags.some(tag => tag.name.toLowerCase().includes(searchTerm)))
        );
    }
    
    renderTasks(filtered);
}

// Открытие/закрытие формы создания задачи
const openCreateTaskBtn = document.getElementById('openCreateTaskBtn');
const closeCreateTaskBtn = document.getElementById('closeCreateTaskBtn');
const createTaskCard = document.getElementById('createTaskCard');

if (openCreateTaskBtn) {
    openCreateTaskBtn.addEventListener('click', () => {
        createTaskCard.style.display = 'block';
        openCreateTaskBtn.style.display = 'none';
        document.getElementById('taskTitle').focus();
    });
}

if (closeCreateTaskBtn) {
    closeCreateTaskBtn.addEventListener('click', () => {
        createTaskCard.style.display = 'none';
        openCreateTaskBtn.style.display = 'flex';
        createTaskForm.reset();
    });
}

// Показ уведомления
function showNotification(message, type = 'info') {
    const alertClass = type === 'success' ? 'alert-success' : 
                       type === 'error' ? 'alert-error' : 'alert-info';
    const icon = type === 'success' ? 'fa-check-circle' : 
                 type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    
    const alert = document.createElement('div');
    alert.className = `alert ${alertClass}`;
    alert.innerHTML = `
        <div class="flex items-center gap-3">
            <i class="fas ${icon}"></i>
            <span>${message}</span>
        </div>
    `;
    
    const main = document.querySelector('.main .container');
    main.insertBefore(alert, main.firstChild);
    
    setTimeout(() => {
        alert.remove();
    }, 3000);
}

// Инициализация
loadTasks();
</script>
