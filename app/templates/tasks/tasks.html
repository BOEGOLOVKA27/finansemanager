{% extends "base.html" %}

{% block title %}Задачи — FinanceTrack{% endblock %}

{% block content %}
<section class="tasks-section">
    <div class="tasks-layout">
        <!-- Основной контент -->
        <div class="tasks-main-content">
            <div class="section-header">
        <div class="header-left">
            <h2 class="section-title">Управление задачами</h2>
            
            <!-- Кнопка фильтра -->
            <div class="filter-container">
                <button class="btn btn-icon" id="filterBtn" title="Фильтры и сортировка">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                </button>

                <!-- Выпадающий список фильтров -->
                <div class="filter-dropdown" id="filterDropdown" style="display: none;">
                    <div class="filter-section">
                        <span class="filter-label">Сортировка</span>
                        <div class="filter-options">
                            <button class="filter-option" data-sort="date_desc">📅 По дате (новые)</button>
                            <button class="filter-option" data-sort="date_asc">📅 По дате (старые)</button>
                            <button class="filter-option" data-sort="alpha_asc">🔤 А-Я</button>
                            <button class="filter-option" data-sort="alpha_desc">🔤 Я-А</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <button class="btn btn-primary" id="openCreateTaskBtn">
            <i class="fas fa-plus"></i>
            Новая задача
        </button>
    </div>

    <!-- Карточка создания задачи (скрыта по умолчанию) -->
    <div class="card" id="createTaskCard" style="display: none;">
        <div class="card-body">
            <div class="card-header">
                <h3 class="card-title">Создать новую задачу</h3>
                <button class="btn btn-outline btn-sm" id="closeCreateTaskBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="createTaskForm" class="task-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="taskTitle" class="form-label">Название задачи *</label>
                        <input type="text" id="taskTitle" name="title" class="form-input" required placeholder="Введите название задачи">
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDescription" class="form-label">Описание</label>
                        <textarea id="taskDescription" name="description" class="form-input form-textarea" rows="3" placeholder="Введите описание задачи (необязательно)"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskTagInput" class="form-label">Теги</label>
                        <div class="tag-input-wrapper">
                            <input type="text" id="taskTagInput" class="form-input" placeholder="Введите тег и нажмите Добавить">
                            <button type="button" class="btn btn-primary btn-sm" id="addTagBtn">
                                <i class="fas fa-plus"></i> Добавить
                            </button>
                        </div>
                        <div class="selected-tags" id="selectedTagsContainer"></div>
                        <small class="form-hint">Добавляйте теги по одному, каждый будет с хештегом</small>
                        <input type="hidden" id="taskTags" name="tags">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-plus"></i>
                        Создать задачу
                    </button>
                    <button type="reset" class="btn btn-outline">
                        <i class="fas fa-undo"></i>
                        Очистить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Фильтры и поиск -->
    <div class="tasks-filters">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">
                <i class="fas fa-list"></i>
                Все
            </button>
            <button class="filter-btn" data-filter="pending">
                <i class="fas fa-clock"></i>
                В работе
            </button>
            <button class="filter-btn" data-filter="completed">
                <i class="fas fa-check-circle"></i>
                Выполненные
            </button>
        </div>

        <div class="search-group">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchTasks" class="search-input" placeholder="Поиск задач...">
            </div>
        </div>
    </div>

    <!-- Вкладки тегов -->
    <div class="tag-tabs-bar" id="tagTabsBar">
        <div class="tag-tabs-container" id="tagTabsContainer">
            <!-- Вкладки будут добавлены динамически -->
        </div>
        <button class="close-all-tags-btn" id="closeAllTagsBtn" title="Закрыть все вкладки">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Список задач -->
    <div class="card">
        <div class="card-body">
            <div class="card-header">
                <h3 class="card-title">Список задач</h3>
                <div class="task-stats">
                    <span class="stat-badge stat-total">Всего: <strong id="totalTasks">0</strong></span>
                    <span class="stat-badge stat-pending">В работе: <strong id="pendingTasks">0</strong></span>
                    <span class="stat-badge stat-completed">Выполнено: <strong id="completedTasks">0</strong></span>
                </div>
            </div>
            
            <div id="tasksList" class="tasks-list">
                <!-- Задачи будут загружены здесь -->
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Загрузка задач...</span>
                </div>
            </div>
        </div>
    </div>

</div>
</section>

<script type="module">
import { ServerAPI } from '{{ url_for("static", filename="js/server.js") }}';

const serverAPI = new ServerAPI();

// Функция для получения и сохранения токена через сессию Flask
async function fetchAndStoreToken() {
    // Проверяем, есть ли уже токен в localStorage/sessionStorage
    const existingToken = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
    if (existingToken) {
        console.log('Токен уже существует:', existingToken.substring(0, 20) + '...');
        return true;
    }
    
    try {
        // Запрашиваем токен через API, используя существующую сессию Flask
        const response = await fetch('/api/auth/token', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            credentials: 'same-origin' // Отправляем куки сессии
        });
        
        if (response.ok) {
            const data = await response.json();
            if (data.status === 'success' && data.access_token) {
                // Сохраняем токен в localStorage
                localStorage.setItem('access_token', data.access_token);
                console.log('Токен успешно получен и сохранен');
                return true;
            }
        }
        console.error('Не удалось получить токен:', response.status);
        return false;
    } catch (error) {
        console.error('Ошибка при получении токена:', error);
        return false;
    }
}

// Элементы DOM
const createTaskForm = document.getElementById('createTaskForm');
const tasksList = document.getElementById('tasksList');
const searchInput = document.getElementById('searchTasks');
const filterButtons = document.querySelectorAll('.filter-btn');
const totalTasksEl = document.getElementById('totalTasks');
const pendingTasksEl = document.getElementById('pendingTasks');
const completedTasksEl = document.getElementById('completedTasks');

let allTasks = [];
let currentFilter = 'all';
let activeTagTabs = [];          // Массив открытых вкладок тегов
let currentActiveTab = null;     // null = "Все", строка = имя выбранного тега
let currentSort = 'date_desc';

// Загрузка состояния вкладок из localStorage
function loadTabState() {
    try {
        const saved = localStorage.getItem('task_tag_tabs');
        if (saved) {
            activeTagTabs = JSON.parse(saved);
        }
    } catch (e) {
        activeTagTabs = [];
    }
    try {
        const savedActive = localStorage.getItem('task_active_tab');
        if (savedActive && savedActive !== 'null') {
            // Проверяем, есть ли такой тег всё ещё в открытых вкладках
            if (activeTagTabs.includes(savedActive)) {
                currentActiveTab = savedActive;
            }
        }
    } catch (e) {
        currentActiveTab = null;
    }
}

// Сохранение состояния вкладок в localStorage
function saveTabState() {
    try {
        localStorage.setItem('task_tag_tabs', JSON.stringify(activeTagTabs));
        localStorage.setItem('task_active_tab', currentActiveTab || 'null');
    } catch (e) {
        // ignore
    }
}

// Загрузка задач
async function loadTasks() {
    // Сначала убеждаемся, что токен получен
    await fetchAndStoreToken();
    
    try {
        const data = await serverAPI.get('/api/tasks', { per_page: 100 });
        
        if (data.status === 'success') {
            allTasks = data.data;
            renderTasks();
            updateStats();
        } else {
            showEmptyState('Ошибка загрузки задач');
        }
    } catch (error) {
        console.error('Error loading tasks:', error);
        showEmptyState('Не удалось загрузить задачи');
    }
}

// Рендеринг задач
function renderTasks(filteredTasks = null) {
    const tasks = filteredTasks || allTasks;
    
    if (tasks.length === 0) {
        const emptyMsg = currentActiveTab ? `Нет задач с тегом #${currentActiveTab}` : null;
        showEmptyState(emptyMsg);
        return;
    }
    
    tasksList.innerHTML = tasks.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
            <input type="checkbox" class="task-checkbox" 
                   ${task.completed ? 'checked' : ''} 
                   onchange="toggleTaskStatus(${task.id}, ${!task.completed})">
            
            <div class="task-content">
                <div class="task-header-row">
                    <h4 class="task-title">${escapeHtml(task.title)}</h4>
                    <div class="task-actions-row">
                        ${task.description ? `<button class="task-toggle-btn" onclick="toggleTaskDescription(${task.id})" title="Показать описание">
                            <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>` : '<span style="width: 16px;"></span>'}
                        <span class="task-date">

// Экранирование HTML
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;

// Массив для хранения выбранных тегов
let selectedTags = [];

// Функция для добавления тега
function addTag() {
    const tagInput = document.getElementById('taskTagInput');
    const tagName = tagInput.value.trim();
    
    if (!tagName) {
        return;
    }
    
    // Проверяем, нет ли уже такого тега
    if (selectedTags.some(t => t.toLowerCase() === tagName.toLowerCase())) {
        showNotification('Такой тег уже добавлен', 'error');
        return;
    }
    
    selectedTags.push(tagName);
    renderSelectedTags();
    tagInput.value = '';
    tagInput.focus();
}

// Функция для удаления тега
function removeTag(tagName) {
    console.log('Удаление тега:', tagName);
    selectedTags = selectedTags.filter(t => t !== tagName);
    renderSelectedTags();
}

// Рендеринг выбранных тегов
function renderSelectedTags() {
    const container = document.getElementById('selectedTagsContainer');
    const hiddenInput = document.getElementById('taskTags');
    
    if (selectedTags.length === 0) {
        container.innerHTML = '';
        hiddenInput.value = '';
        return;
    }
    
    container.innerHTML = selectedTags.map((tag, index) => `
        <span class="selected-tag-item">
            #${escapeHtml(tag)}
            <i class="fas fa-times remove-tag" data-tag-index="${index}" title="Удалить тег"></i>
        </span>
    `).join('');
    
    // Добавляем обработчики кликов для крестиков
    container.querySelectorAll('.remove-tag').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const index = this.getAttribute('data-tag-index');
            if (index !== null) {
                const tagToRemove = selectedTags[parseInt(index)];
                removeTag(tagToRemove);
            }
        });
    });
    
    hiddenInput.value = selectedTags.join(',');
}

// Создание задачи
createTaskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';
    
    const formData = new FormData(createTaskForm);
    const tagsInput = formData.get('tags');
    
    // Получаем существующие теги или создаем новые
    let tagIds = [];
    if (tagsInput && tagsInput.trim()) {
        const tagNames = tagsInput.split(',').map(t => t.trim()).filter(t => t);
        
        // Получаем все теги пользователя
        try {
            const tagsData = await serverAPI.get('/api/tags');
            
            if (tagsData.status === 'success') {
                const existingTags = tagsData.data;
                
                // Находим ID существующих тегов и создаем новые
                for (const name of tagNames) {
                    let existingTag = existingTags.find(t => t.name.toLowerCase() === name.toLowerCase());
                    
                    if (existingTag) {
                        tagIds.push(existingTag.id);
                    } else {
                        // Создаем новый тег
                        try {
                            const newTagData = await serverAPI.post('/api/tags', { name: name });
                            if (newTagData.status === 'success') {
                                tagIds.push(newTagData.data.id);
                                existingTags.push(newTagData.data);
                            }
                        } catch (tagError) {
                            console.error('Error creating tag:', tagError);
                        }
                    }
                }
            }
        } catch (error) {
            console.error('Error fetching tags:', error);
        }
    }
    
    const taskData = {
        title: formData.get('title'),
        description: formData.get('description') || '',
        tag_ids: tagIds
    };
    
    try {
        const data = await serverAPI.post('/api/tasks', taskData);
        
        if (data.status === 'success') {
            // Добавляем новую задачу в список
            allTasks.unshift(data.data);
            renderTasks();
            updateStats();
            
            createTaskForm.reset();
            selectedTags = [];
            renderSelectedTags();
            
            // Показываем уведомление
            showNotification('Задача успешно создана!', 'success');
        } else {
            showNotification(data.message || 'Ошибка при создании задачи', 'error');
        }
    } catch (error) {
        console.error('Error creating task:', error);
        showNotification('Ошибка при создании задачи', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-plus"></i> Создать задачу';
    }
});

                updateStats();

            loadTasks(); // Перезагружаем задачи
        }

        console.error('Error toggling task status:', error);

};

searchInput.addEventListener('input', applyFilters);

// Применение фильтров и поиска
function applyFilters() {
    let filtered = [...allTasks];
    
    // Фильтр по статусу (из старого интерфейса)
    if (currentFilter === 'pending') {
        filtered = filtered.filter(t => !t.completed);
    } else if (currentFilter === 'completed') {
        filtered = filtered.filter(t => t.completed);
    }
    
    // Фильтр по активному тегу (вкладке) — показывает только задачи с этим тегом
    if (currentActiveTab) {
        filtered = filtered.filter(t =>
            t.tags && t.tags.some(tag => tag.name.toLowerCase() === currentActiveTab.toLowerCase())
        );
    }
    
    // Поиск
    const searchTerm = searchInput.value.toLowerCase().trim();
    if (searchTerm) {
        filtered = filtered.filter(t => 
            t.title.toLowerCase().includes(searchTerm) ||
            (t.description && t.description.toLowerCase().includes(searchTerm)) ||
            (t.tags && t.tags.some(tag => tag.name.toLowerCase().includes(searchTerm)))
        );
    }
    
    // Сортировка
    applySortToTasks(filtered);
    
    renderTasks(filtered);
}

// Сортировка задач
function applySort(sortType) {
    currentSort = sortType;
    applyFilters();
}

function applySortToTasks(tasks) {
    switch(currentSort) {
        case 'date_desc':
            tasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            break;
        case 'date_asc':
            tasks.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            break;
        case 'alpha_asc':
            tasks.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
            break;
        case 'alpha_desc':
            tasks.sort((a, b) => b.title.localeCompare(a.title, 'ru'));
            break;
    }
}

// Фильтрация по тегу — открывает/добавляет вкладку и переключается на неё
window.filterByTag = function(tagName) {
    // Если вкладка ещё не открыта — добавляем
    if (!activeTagTabs.includes(tagName)) {
        activeTagTabs.push(tagName);
    }

    // Переключаемся на эту вкладку
    currentActiveTab = tagName;
    saveTabState();
    applyFilters();
    renderTagTabs();
};

// Закрытие одной вкладки тега
window.closeTagTab = function(tagName) {
    activeTagTabs = activeTagTabs.filter(t => t !== tagName);

    // Если закрыли активную вкладку — переключаемся на "Все"
    if (currentActiveTab === tagName) {
        currentActiveTab = null;
    }

    saveTabState();
    applyFilters();
    renderTagTabs();
};

// Закрытие всех вкладок тегов
window.closeAllTagTabs = function() {
    activeTagTabs = [];
    currentActiveTab = null;
    saveTabState();
    applyFilters();
    renderTagTabs();
};

// Рендеринг вкладок тегов
function renderTagTabs() {
    const bar = document.getElementById('tagTabsBar');
    const container = document.getElementById('tagTabsContainer');

    bar.style.display = 'flex';

    // Вкладка «Все» — подсвечена когда currentActiveTab = null
    const allActiveClass = currentActiveTab === null ? 'active' : '';
    let html = `
        <div class="tag-tab tab-all ${allActiveClass}" onclick="toggleShowAllTasks()">
            <span>📋 Все</span>
        </div>
    `;

    for (const tagName of activeTagTabs) {
        const tabActive = currentActiveTab === tagName ? 'tab-active' : '';
        html += `
            <div class="tag-tab ${tabActive}" onclick="switchToTab('${escapeHtml(tagName)}')">
                <span>#${escapeHtml(tagName)}</span>
                <button class="tab-close" onclick="event.stopPropagation(); closeTagTab('${escapeHtml(tagName)}')" title="Закрыть вкладку">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;
    }

    container.innerHTML = html;
}

    currentActiveTab = tagName;

    applyFilters();

};

// Показ уведомления
function showNotification(message, type = 'info') {
    const alertClass = type === 'success' ? 'alert-success' : 
                       type === 'error' ? 'alert-error' : 'alert-info';
    const icon = type === 'success' ? 'fa-check-circle' : 
                 type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    
    const alert = document.createElement('div');
    alert.className = `alert ${alertClass}`;
    alert.innerHTML = `
        <div class="flex items-center gap-3">
            <i class="fas ${icon}"></i>
            <span>${message}</span>
        </div>
    `;
    
    const main = document.querySelector('.main .container');
    main.insertBefore(alert, main.firstChild);
    
    setTimeout(() => {
        alert.remove();
    }, 3000);
}

        } else {
            tagsList.innerHTML = `
                <div class="empty-state" style="padding: 1rem;">
                    <i class="fas fa-tags"></i>
                    <p>Нет популярных тегов</p>
                </div>
            `;
        }
    } catch (error) {
        console.error('Ошибка загрузки популярных тегов:', error);
        document.getElementById('popularTagsList').innerHTML = `
            <div class="empty-state" style="padding: 1rem;">
                <i class="fas fa-exclamation-circle"></i>
                <p>Не удалось загрузить теги</p>
            </div>
        `;
    }
}

// Инициализация
loadTabState();
renderTagTabs();
loadTasks();
loadPopularTags();
</script>
{% endblock %}
